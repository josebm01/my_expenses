<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inicio — resumen del mes</title>

</head>

</style>
</helmet>

      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #5B616E; font-weight: 500">Hola, Jose</span>
        <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Octubre 2026</h1>
      </div>
      <div style="display: flex; gap: 8px">
        <button aria-label="Mes anterior" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E4E6E1; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #15171C">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
        </button>
        <button aria-label="Mes siguiente" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E4E6E1; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #15171C">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
        </button>
      </div>
    </div>

    <section style="background: #15171C; color: #FFFFFF; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 16px">

        <span style="font-size: 13px; color: #B9BEC8; font-weight: 500">Balance del mes</span>
        <span style="font-size: 38px; font-weight: 800; letter-spacing: -0.03em">$8,450.00</span>
        <span style="font-size: 12px; color: #B9BEC8">Ahorras el 26.4% de tus ingresos</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="background: #23262E; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #B9BEC8; font-weight: 500">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7FCDE6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7L7 17M15 17H7V9"></path></svg>Ingresos
          </span>
          <span style="font-size: 18px; font-weight: 700">$32,000.00</span>
        </div>
        <div style="background: #23262E; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #B9BEC8; font-weight: 500">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5A47C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg>Gastos
          </span>
          <span style="font-size: 18px; font-weight: 700">$23,550.00</span>
        </div>
      </div>
    </section>

    <section style="background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700">Gastos por categoría</h2>
        <a href="Categorias.dc.html" style="font-size: 13px; font-weight: 700">Ver todo</a>
      </div>
      <div style="display: flex; height: 10px; border-radius: 999px; overflow: hidden; gap: 2px">
        <sc-for list="{{cats}}" as="s" hint-placeholder-count="7">
          <div style="height: 10px; width: {{s.w}}; background: {{s.color}}"></div>
        </sc-for>
      </div>
      <sc-for list="{{top}}" as="c" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px">
          <div style="width: 40px; height: 40px; border-radius: 12px; background: {{c.tint}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
            <div style="display: flex; justify-content: space-between; gap: 8px">
              <span style="font-size: 14px; font-weight: 600">{{c.name}}</span>
              <span style="font-size: 14px; font-weight: 700">{{c.amount}}</span>
            </div>
            <div style="height: 6px; background: #EEF0EC; border-radius: 999px; overflow: hidden">
              <div style="height: 6px; width: {{c.bar}}; background: {{c.color}}; border-radius: 999px"></div>
            </div>
          </div>
          <span style="font-size: 12px; color: #5B616E; width: 40px; text-align: right; font-weight: 600">{{c.pct}}</span>
        </div>
      </sc-for>
    </section>

    <section style="background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700">Últimos movimientos</h2>
        <a href="Movimientos.dc.html" style="font-size: 13px; font-weight: 700">Ver todos</a>
      </div>
      <sc-for list="{{recent}}" as="t" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 6px 0">
          <div style="width: 40px; height: 40px; border-radius: 12px; background: {{t.tint}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 14px; font-weight: 600">{{t.name}}</span>
            <span style="font-size: 12px; color: #5B616E">{{t.meta}}</span>
          </div>
          <span style="font-size: 14px; font-weight: 700; color: {{t.amtColor}}">{{t.amount}}</span>
        </div>
      </sc-for>
    </section>
  </main>

  <nav aria-label="Navegación principal" style="height: 84px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E4E6E1; display: flex; align-items: flex-start; justify-content: space-around; padding: 6px 8px 0; box-sizing: border-box">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #15171C; min-width: 60px; min-height: 44px; padding-top: 6px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio
    </a>
    <a href="Movimientos.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #5B616E; min-width: 60px; min-height: 44px; padding-top: 6px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>Movimientos
    </a>
    <a href="Agregar.dc.html" aria-label="Agregar movimiento" style="width: 56px; height: 56px; border-radius: 18px; background: #15171C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-top: -2px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
    <a href="Categorias.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #5B616E; min-width: 60px; min-height: 44px; padding-top: 6px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9v9z"></path><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"></path></svg>Resumen
    </a>
    <button style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #5B616E; min-width: 60px; min-height: 44px; padding-top: 6px; background: none; border: 0; font-family: inherit; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>Ajustes
    </button>
  </nav>
</div>
</x-dc>
