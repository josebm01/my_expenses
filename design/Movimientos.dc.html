<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Movimientos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#0B6A86;text-decoration:none}a:hover{color:#08506A}
input::placeholder{color:#7A808C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F4F1; font-family: Manrope, system-ui, sans-serif; color: #15171C; display: flex; flex-direction: column; overflow: hidden; font-variant-numeric: tabular-nums">
  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 52px 20px 16px; overflow: hidden">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Movimientos</h1>
      <button style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #DADDD6; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #15171C; display: flex; align-items: center; gap: 6px; cursor: pointer">
        Octubre
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; height: 46px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E6E1; padding: 0 14px; box-sizing: border-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B616E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar movimiento</span>
      <input placeholder="Buscar por concepto o nota" style="flex: 1; border: 0; outline: none; font-family: inherit; font-size: 15px; background: transparent; color: #15171C; min-width: 0">
    </label>

    <div role="group" aria-label="Filtrar" style="display: flex; gap: 8px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
        <button onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: #FFFFFF; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #5B616E; font-weight: 600">Ingresos</span>
        <span style="font-size: 16px; font-weight: 800; color: #0B6A86">+$32,000.00</span>
      </div>
      <div style="background: #FFFFFF; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #5B616E; font-weight: 600">Gastos</span>
        <span style="font-size: 16px; font-weight: 800; color: #B93D0B">−$23,550.00</span>
      </div>
    </div>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; padding: 0 4px">
          <h2 style="margin: 0; font-size: 13px; font-weight: 700; color: #5B616E">{{g.label}}</h2>
          <span style="font-size: 13px; font-weight: 600; color: #5B616E">{{g.total}}</span>
        </div>
        <div style="background: #FFFFFF; border-radius: 18px; padding: 4px 14px; display: flex; flex-direction: column">
          <sc-for list="{{g.items}}" as="t" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0">
              <div style="width: 40px; height: 40px; border-radius: 12px; background: {{t.tint}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
              </div>
              <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
                <span style="font-size: 14px; font-weight: 600">{{t.name}}</span>
                <span style="font-size: 12px; color: #5B616E">{{t.meta}}</span>
              </div>
              <span style="font-size: 14px; font-weight: 700; color: {{t.amtColor}}">{{t.amount}}</span>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>

  <nav aria-label="Navegación principal" style="height: 84px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E4E6E1; display: flex; align-items: flex-start; justify-content: space-around; padding: 6px 8px 0; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #5B616E; min-width: 60px; min-height: 44px; padding-top: 6px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio
    </a>
    <a href="Movimientos.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #15171C; min-width: 60px; min-height: 44px; padding-top: 6px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>Movimientos
    </a>
    <a href="Agregar.dc.html" aria-label="Agregar movimiento" style="width: 56px; height: 56px; border-radius: 18px; background: #15171C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-top: -2px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
    <a href="Categorias.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #5B616E; min-width: 60px; min-height: 44px; padding-top: 6px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9v9z"></path><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"></path></svg>Resumen
    </a>
    <button style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #5B616E; min-width: 60px; min-height: 44px; padding-top: 6px; background: none; border: 0; font-family: inherit; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>Ajustes
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'todos' };
  }
  renderVals() {
    var self = this;
    var f = this.state.filter;
    var I = {
      alimentos: 'M3 4h2l2.4 11h11.2L21 8H6.2M9 20h.01M18 20h.01',
      transporte: 'M5 16v-5l2-5h10l2 5v5M5 16h14M5 16v2M19 16v2M7.5 13h.01M16.5 13h.01',
      entretenimiento: 'M3 9a2 2 0 0 0 0 6v3h18v-3a2 2 0 0 0 0-6V6H3zM13 6v12',
      salud: 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z',
      servicios: 'M13 3L5 14h6l-1 7 8-11h-6z',
      compras: 'M6 7h12l-1 13H7zM9 7a3 3 0 0 1 6 0',
      ingreso: 'M17 7L7 17M15 17H7V9'
    };
    var C = {
      alimentos: ['Alimentos', '#C25E14', '#FCEBDD'], transporte: ['Transporte', '#9A7410', '#F8EFD3'],
      entretenimiento: ['Entretenimiento', '#7444C0', '#EEE6FA'], salud: ['Salud', '#1E7F73', '#DDF2EF'],
      servicios: ['Servicios', '#B03A6E', '#F8E3EC'], compras: ['Compras', '#2F5FC4', '#E2EAFB'],
      ingreso: ['Freelance', '#0B6A86', '#DDF0F6']
    };
    var raw = [
      { label: 'Hoy · vie 31 oct', items: [['alimentos', 'Superama', 'Súper de la semana', -842.5], ['transporte', 'Uber', 'Oficina → casa', -126]] },
      { label: 'Ayer · jue 30 oct', items: [['ingreso', 'Pago freelance', 'Landing page cliente', 4000], ['entretenimiento', 'Cinépolis', 'Boletos + palomitas', -310]] },
      { label: 'mié 29 oct', items: [['salud', 'Farmacia San Pablo', 'Medicamentos', -385], ['servicios', 'CFE', 'Luz bimestral', -540], ['compras', 'Amazon', 'Audífonos', -699]] }
    ];
    function money(n) {
      var s = Math.abs(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return (n < 0 ? '−$' : '+$') + s;
    }
    var groups = raw.map(function (g) {
      var items = g.items.filter(function (t) {
        return f === 'todos' || (f === 'gastos' ? t[3] < 0 : t[3] > 0);
      }).map(function (t) {
        var c = C[t[0]];
        return { name: t[1], meta: c[0] + ' · ' + t[2], amount: money(t[3]), icon: I[t[0]], color: c[1], tint: c[2], amtColor: t[3] > 0 ? '#0B6A86' : '#15171C' };
      });
      var total = g.items.filter(function (t) { return f === 'todos' || (f === 'gastos' ? t[3] < 0 : t[3] > 0); })
        .reduce(function (a, t) { return a + t[3]; }, 0);
      return { label: g.label, items: items, total: money(total) };
    }).filter(function (g) { return g.items.length > 0; });
    var base = 'height: 36px; padding: 0 16px; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; ';
    var filters = [['todos', 'Todos'], ['gastos', 'Gastos'], ['ingresos', 'Ingresos']].map(function (x) {
      var on = f === x[0];
      return {
        label: x[1], pressed: on ? 'true' : 'false',
        style: base + (on ? 'background: #15171C; color: #FFFFFF; border: 1px solid #15171C;' : 'background: #FFFFFF; color: #15171C; border: 1px solid #DADDD6;'),
        pick: function () { self.setState({ filter: x[0] }); }
      };
    });
    return { groups: groups, filters: filters };
  }
}
</script>
</body>
</html>
