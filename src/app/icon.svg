<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Logo de la barra lateral: "$" sobre cuadro redondeado; se invierte con pestañas en modo oscuro. -->
  <style>
    rect { fill: #15171c; }
    text { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      rect { fill: #ffffff; }
      text { fill: #15171c; }
    }
  </style>
  <rect width="32" height="32" rx="9" />
  <text x="16" y="23.5" text-anchor="middle" font-family="Manrope, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800">$</text>
</svg>
