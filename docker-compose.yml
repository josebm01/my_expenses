services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: my_expenses
      POSTGRES_PASSWORD: my_expenses
      POSTGRES_DB: my_expenses
      TZ: America/Mexico_City
    # 5433 en el host para no chocar con otros Postgres locales en 5432.
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_expenses -d my_expenses"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
